spring:
  application:
    name: BE_CapNong

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ===============================
  # LOAD ENV FILE
  # ===============================
  config:
    import: optional:file:.env[.properties]

  # ===============================
  # DATABASE (MYSQL)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
    username: test
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# ===============================
# JWT CONFIG (MAP FROM .env)
# ===============================
jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

# ===============================
# PAYOS CONFIGURATION
# ===============================
payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}

# ===============================
# SERVER
# ===============================
server:
  port: 8080
  servlet:
    context-path: /api


# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        web: INFO

# ===============================
# AWS REKOGNITION (AI MODERATION)
# ===============================
aws:
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  region: ${AWS_REGION:ap-southeast-1}
  moderation:
    min-confidence: 75.0
    unsafe-min-confidence: 60.0
    non-agri-threshold: 80.0
    max-labels: 30
    label-min-confidence: 50.0
    max-file-size-bytes: 5242880
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
