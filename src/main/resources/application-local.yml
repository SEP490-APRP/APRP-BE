spring:
  application:
    name: BE_CapNong

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ===============================
  # JACKSON (JSON serialization)
  # ===============================
  jackson:
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → "2026-09-29T19:34:44" (ISO-8601)
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Ho_Chi_Minh

  # ===============================
  # LOAD ENV FILE
  # ===============================
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:BE/.env[.properties]

  # ===============================
  # DATABASE (MYSQL)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/DB_CapNong?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 30
        connection:
          characterEncoding: UTF-8
          useUnicode: true

  # ===============================
  # MAIL (GMAIL SMTP)
  # ===============================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# ===============================
# JWT CONFIG (MAP FROM .env)
# ===============================
jwt:
  signer-key: ${JWT_SIGNER_KEY:1234567890123456789012345678901234567890123456789012345678901234}
  valid-duration: ${JWT_VALID_DURATION:86400}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:604800}

# ===============================
# CLOUDINARY CONFIG
# ===============================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ===============================
# PAYOS CONFIGURATION
# ===============================
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/result}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/result}

# ===============================
# SERVER
# ===============================
server:
  port: 8080
  servlet:
    context-path: /api


# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        web: INFO

# ===============================
# GOOGLE CLOUD CONFIGURATION (AI MODERATION & MAPS)
# ===============================
# Lấy Service Account JSON tại https://console.cloud.google.com → IAM & Admin → Service Accounts
# Bật Cloud Vision API tại APIs & Services → Library
google:
  vision:
    credentials-path: ${GOOGLE_VISION_CREDENTIALS_PATH:classpath:credentials.json}
    min-confidence: 70.0
    non-agri-threshold: 80.0
    max-labels: 30
    max-file-size-bytes: 5242880
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:${GEMINI_KEY_1:}}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout-seconds: 45

