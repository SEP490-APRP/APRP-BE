spring:
  application:
    name: BE_CapNong

  # ===============================
  # LOAD ENV FILE
  # ===============================
  config:
    import: optional:file:.env[.properties]

  # ===============================
  # DATABASE (MYSQL)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/DB_CapNong?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ===============================
  # MAIL (GMAIL SMTP)
  # ===============================
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ===============================
  # OAUTH2 CLIENT (GOOGLE LOGIN)
  # ===============================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# ===============================
# JWT CONFIG (MAP FROM .env)
# ===============================
jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

# ===============================
# CLOUDINARY CONFIG
# ===============================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ===============================
# SERVER
# ===============================
server:
  port: 8080
  servlet:
    context-path: /


# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        web: INFO
